name: Verify faat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance:
    name: Finance guards and captured receipts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[service,contracts,validation]'
      - name: Product regression suite (offline)
        env:
          PYTHONPATH: src:tests
          STAKE_METADATA_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          python -m unittest
          test_native_execution test_native_adjustments test_native_performance
          test_performance_periods test_wallet_encoding test_machine_worker
          test_usdd_workflow test_usdd_execution test_usdd_comparison
          test_stake_execution test_stake_evidence_projection test_stake_observations
          test_stake_watch test_stake_postgres test_machine_bridge
      - name: Validate captured Nile receipts without broadcasting
        run: python scripts/verify_nile_receipts.py

  frontend:
    name: Workspace, wallet and frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
